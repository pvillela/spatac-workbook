[package]
name = "spatac-workbook"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Utilities and documentation to support Antiquary RF project tracking and investment planning."

[dependencies]
# The local date for the Investment Plan's cover, on Linux and Windows alike. Already linked
# through umya-spreadsheet, so it adds no crate.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Command-line parsing for both binaries.
clap = { version = "4.5", features = ["derive"] }
# Finds cell references in formula text, which is what lets a formula be compared after the rows
# and columns it refers to have moved.
regex = "1.11"
# Myers sequence alignment of rows, columns and tab orders. Linear in memory, unlike a dynamic
# programming LCS, so a sheet with tens of thousands of rows still diffs.
similar = "2.6"
# Stores row heights and column widths as f64 written straight through, which is what lets this
# reproduce the reference workbook exactly. rust_xlsxwriter models both as whole pixels and cannot
# represent the template's 13.8pt rows or 1.39-wide spacers.
umya-spreadsheet = "3.1.1"
# Reads the cell formats of an .xlsx file, to find which cells are unlocked: umya-spreadsheet
# loses protection inherited from a cell style. Already linked through umya-spreadsheet, with the
# same features, so it adds no crate.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
# Verifies that the generated third-party notices match the dependency graph they were made from.
# `ignore-build-dependencies` in `about.toml` keeps it out of the notices it guards.
sha2 = "0.11.0"

[profile.release]
# The tools are downloaded as single files, so the debug symbols are worth removing: they are most
# of the binary and nothing in the field reads them.
strip = "symbols"
